name: Pre-production checks

on:
  pull_request:
    branches:
      - production
  push:
    branches:
      - staging

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block tracked .env files
        run: |
          tracked="$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "Tracked .env files found (must not be committed):"
            echo "$tracked"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        env:
          SECRET_KEY: ci-check-secret-key
          DEBUG: 'False'
          DB_ENGINE: sqlite
        run: python manage.py check

      - name: Verify migrations are up to date
        working-directory: backend
        env:
          SECRET_KEY: ci-check-secret-key
          DEBUG: 'False'
          DB_ENGINE: sqlite
        run: python manage.py makemigrations --check --dry-run

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000/api
        run: npm run build
